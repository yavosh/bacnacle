[package]
name = "barnacle"
version = "0.1.0"
edition = "2024"
description = "Experimental Rust scanner for ClamAV signatures"
publish = false

[dependencies]
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
memmap2 = "0.9"
tempfile = "3"
nix = { version = "0.30", features = ["fs", "poll", "user", "signal", "process", "resource"] }
socket2 = { version = "0.6", features = ["all"] }
signal-hook = "0.3"
regex = "1"
flate2 = "1"
tar = "0.4"
rustix = { version = "1", features = ["fs", "net"] }
aho-corasick = "1"

[dev-dependencies]
serde_json = "1"
sha3 = "0.11"
